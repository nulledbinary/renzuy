name: CI

# Runs on PRs targeting main, and on direct pushes to main.
# Pushes to `development` (or any other branch) do nothing — the deploy workflow
# also only fires on main, so feature branches never trigger AWS work.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew --no-daemon --no-configuration-cache build

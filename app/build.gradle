plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':youtube-source')

    implementation libs.jda
    implementation libs.jdave.api
    // Ship both platform natives; jdave picks the right one at runtime via os.name.
    // Windows is for local dev, Linux is for the ECS / Docker production image.
    runtimeOnly libs.jdave.natives.win
    runtimeOnly libs.jdave.natives.linux
    implementation libs.slf4j.simple

    // DynamoDB persistence for counting / log bindings / confession audit.
    // url-connection-client keeps the HTTP stack on the JDK's HttpURLConnection
    // instead of pulling Netty into the runtime image.
    implementation libs.awssdk.dynamodb
    runtimeOnly libs.awssdk.url.connection.client

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'renzuy.Bot'
    // jdave uses the Foreign Function & Memory API to load libdave natives.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('run') {
    standardInput = System.in
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
}

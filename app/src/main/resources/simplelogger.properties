# slf4j-simple logging configuration for the renzuy bot.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# DEBUG on JDA's voice package so Discord voice WebSocket close codes are logged.
# Dial back to 'info' once voice playback is confirmed working.
org.slf4j.simpleLogger.log.net.dv8tion.jda.internal.audio=debug

# DEBUG on the youtube-source library so per-client rotation failures
# ("Innertube client X could not resolve …") are visible in the console.
org.slf4j.simpleLogger.log.renzuy.youtube=debug
